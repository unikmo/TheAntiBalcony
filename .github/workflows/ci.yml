name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: npm run test:nonpayment
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          FULFILLMENT_CALLBACK_SECRET: nonpayment-smoke-secret
